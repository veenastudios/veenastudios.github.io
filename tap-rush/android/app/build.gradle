plugins { id 'com.android.application' }

android {
    namespace 'in.veenastudios.taprush'
    compileSdk 35
    defaultConfig {
        applicationId 'in.veenastudios.taprush'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def path = System.getenv('TAP_RUSH_KEYSTORE_PATH')
            if (path && System.getenv('TAP_RUSH_KEYSTORE_PASSWORD') && System.getenv('TAP_RUSH_KEY_ALIAS') && System.getenv('TAP_RUSH_KEY_PASSWORD')) {
                storeFile file(path)
                storePassword System.getenv('TAP_RUSH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TAP_RUSH_KEY_ALIAS')
                keyPassword System.getenv('TAP_RUSH_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('TAP_RUSH_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
