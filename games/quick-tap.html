<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Tap | SR Gamers</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#fff;font-family:Arial;text-align:center;min-height:100vh;overflow:hidden}.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ffffff18}.brand{font-weight:900;color:#f0c866;letter-spacing:2px}.back{color:#bbb;text-decoration:none}.wrap{max-width:620px;margin:auto;padding:24px 18px}.stats{display:flex;justify-content:space-between;background:#111824;padding:14px 20px;border-radius:18px;margin:16px 0}.stats b{color:#f0c866;font-size:22px}.arena{height:58vh;min-height:390px;position:relative;border:1px solid #ffffff1c;border-radius:26px;background:radial-gradient(circle,#162033,#090e17);overflow:hidden}.target{position:absolute;width:82px;height:82px;border:0;border-radius:50%;font-size:34px;background:#f0c866;box-shadow:0 0 30px #f0c86666;cursor:pointer;transition:transform .08s}.target:active{transform:scale(.82)}.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090e17ee;z-index:3}.start h1{font-size:42px;margin:0;color:#f0c866}.start p{color:#bbc3cf;max-width:330px}.play{border:0;border-radius:999px;background:#f0c866;padding:15px 34px;font-weight:900;font-size:18px}.msg{height:28px;color:#bfc7d2}.danger{background:#df5360;box-shadow:0 0 30px #df536066}.end{font-size:34px;color:#f0c866}</style></head><body><div class="top"><div class="brand">SR GAMERS</div><a class="back" href="/#games">← Home</a></div><div class="wrap"><div class="stats"><span>Score<br><b id="score">0</b></span><span>Time<br><b id="time">30</b></span><span>Best<br><b id="best">0</b></span></div><div class="msg" id="msg">Tap gold. Avoid red.</div><div class="arena" id="arena"><div class="start" id="panel"><h1>QUICK TAP</h1><p>30 seconds. Tap the golden targets as fast as you can. Red means danger — touching it costs 2 points.</p><button class="play" id="play">PLAY</button></div><button class="target" id="target" hidden>⚡</button></div></div><script>
const a=document.getElementById('arena'),t=document.getElementById('target'),p=document.getElementById('panel'),s=document.getElementById('score'),tm=document.getElementById('time'),b=document.getElementById('best'),msg=document.getElementById('msg');let score=0,left=30,timer,running=false,danger=false;b.textContent=localStorage.quickTapBest||0;
function move(){danger=Math.random()<.23;t.classList.toggle('danger',danger);t.textContent=danger?'✕':'⚡';const m=88;t.style.left=Math.random()*Math.max(10,a.clientWidth-m)+'px';t.style.top=Math.random()*Math.max(10,a.clientHeight-m)+'px'}
function start(){score=0;left=30;running=true;s.textContent=0;tm.textContent=30;p.style.display='none';t.hidden=false;move();clearInterval(timer);timer=setInterval(()=>{left--;tm.textContent=left;if(left<=0)end()},1000)}
function end(){running=false;clearInterval(timer);t.hidden=true;let best=Math.max(score,+(localStorage.quickTapBest||0));localStorage.quickTapBest=best;b.textContent=best;p.style.display='flex';p.innerHTML='<div class="end">TIME!</div><h2>Score: '+score+'</h2><p>Best: '+best+'</p><button class="play" onclick="start()">PLAY AGAIN</button>'}
t.onclick=e=>{e.stopPropagation();if(!running)return;if(danger){score=Math.max(0,score-2);msg.textContent='Danger! −2'}else{score++;msg.textContent='Nice! +1'}s.textContent=score;move()};document.getElementById('play').onclick=start;
</script></body></html>
