<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Highway Rush | SR GAMERS</title><style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:Arial,sans-serif;text-align:center}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#070b12;border-bottom:1px solid #ffffff14}.brand{font-weight:900;letter-spacing:2px;color:#efc55e}.home{color:#abb4c3;text-decoration:none}.wrap{max-width:460px;margin:auto;padding:10px 12px 18px}.tag{font-size:10px;letter-spacing:3px;color:#efc55e}.title{font-size:27px;font-weight:900;margin:3px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.hud span{background:#0e1520;border:1px solid #ffffff14;border-radius:12px;padding:7px;font-size:10px;color:#9fa9b8}.hud b{display:block;color:#fff;font-size:19px;margin-top:2px}.world{height:570px;max-height:70vh;min-height:450px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#78b8e8 0 18%,#8ab86d 18% 24%,#353941 24%);border:1px solid #ffffff22;touch-action:none;box-shadow:0 18px 50px #000b}.skyline{position:absolute;top:11%;left:0;right:0;height:13%;background:linear-gradient(90deg,#506475 0 8%,transparent 8% 12%,#3f5668 12% 23%,transparent 23% 28%,#596b77 28% 38%,transparent 38% 43%,#435c70 43% 55%,transparent 55% 61%,#526a7b 61% 73%,transparent 73% 78%,#3e5365 78% 91%,transparent 91%);opacity:.8}.road{position:absolute;z-index:1;top:20%;bottom:-8%;left:12%;right:12%;background:#292d34;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);border-top:2px solid #ddd}.lane{position:absolute;z-index:2;top:22%;bottom:-10%;width:4px;left:50%;background:repeating-linear-gradient(180deg,#fff 0 26px,transparent 27px 58px);transform-origin:top;animation:dash .55s linear infinite;opacity:.8}.lane.l1{left:39%;transform:rotate(7deg)}.lane.l2{left:61%;transform:rotate(-7deg)}@keyframes dash{to{background-position:0 58px}}.edge{position:absolute;z-index:2;top:23%;bottom:0;width:8px;background:repeating-linear-gradient(#fff 0 18px,#d33 19px 36px)}.edge.e1{left:23%;transform:rotate(8deg);transform-origin:top}.edge.e2{right:23%;transform:rotate(-8deg);transform-origin:top}.car,.enemy,.coin{position:absolute;z-index:4;transform:translateX(-50%)}.car{bottom:25px;width:48px;height:82px;border-radius:13px 13px 8px 8px;background:linear-gradient(90deg,#65080d,#d81d28 18% 82%,#65080d);border:2px solid #ff626a;box-shadow:0 8px 20px #000c;transition:left .11s}.car:before,.enemy:before{content:"";position:absolute;left:8px;right:8px;top:11px;height:27px;border-radius:8px 8px 4px 4px;background:linear-gradient(#bdeaff,#214358);border:2px solid #111820}.car:after,.enemy:after{content:"";position:absolute;left:-5px;right:-5px;bottom:12px;height:18px;border-left:6px solid #080a0d;border-right:6px solid #080a0d}.enemy{top:-90px;width:43px;height:74px;border-radius:12px 12px 7px 7px;background:#3579c9;border:2px solid #8fc8ff;box-shadow:0 7px 16px #000b}.coin{top:-45px;width:28px;height:28px;border-radius:50%;background:#ffd343;border:3px solid #fff09b;color:#7a4c00;font-weight:900;line-height:22px;box-shadow:0 0 14px #ffd343}.panel{position:absolute;inset:0;z-index:9;background:linear-gradient(#07101bd9,#05070cf5);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:28px}.panel h1{font-size:35px;margin:0;color:#efc55e}.panel p{color:#bac3d0;line-height:1.55}.play{border:0;border-radius:999px;background:#efc55e;padding:14px 29px;font-size:16px;font-weight:900}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.controls button{height:54px;border-radius:15px;border:1px solid #ffffff1d;background:#101722;color:#fff;font-size:24px}.hint{font-size:11px;color:#7f8998;margin-top:8px}</style></head><body>
<header class="top"><div class="brand">SR GAMERS</div><a class="home" href="/#games">← Home</a></header><main class="wrap"><div class="tag">VEENA STUDIOS • RACING</div><div class="title">HIGHWAY RUSH</div><div class="hud"><span>SCORE<b id="score">0</b></span><span>SPEED<b id="speed">1.0x</b></span><span>BEST<b id="best">0</b></span></div><div class="world" id="world"><div class="skyline"></div><div class="road"></div><div class="lane l1"></div><div class="lane l2"></div><div class="edge e1"></div><div class="edge e2"></div><div class="panel" id="panel"><h1>HIGHWAY RUSH</h1><p>Race through traffic, grab coins and survive.<br>Every few seconds the highway gets faster.</p><button class="play" id="play">START ENGINE</button></div><div class="car" id="car"></div></div><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><div class="hint">Swipe or use steering buttons • Coin +5</div></main><script>
const w=document.getElementById('world'),car=document.getElementById('car'),panel=document.getElementById('panel'),S=document.getElementById('score'),V=document.getElementById('speed'),B=document.getElementById('best');const lanes=[34,50,66];let lane=1,score=0,best=+(localStorage.highwayBest||0),run=false,items=[],last=0,spawnAt=0,raf=0,sx=null;B.textContent=best;function pos(){car.style.left=lanes[lane]+'%'}pos();function steer(d){if(run){lane=Math.max(0,Math.min(2,lane+d));pos()}}function spawn(){let coin=Math.random()<.2,e=document.createElement('div');e.className=coin?'coin':'enemy';e.dataset.lane=Math.floor(Math.random()*3);e.style.left=lanes[e.dataset.lane]+'%';if(coin)e.textContent='$';else{let cs=['#3478c8','#d59a2d','#4b9c62','#895fc0'];e.style.background=cs[Math.floor(Math.random()*cs.length)]}w.appendChild(e);items.push({e,y:-90,coin})}function end(){run=false;cancelAnimationFrame(raf);items.forEach(o=>o.e.remove());items=[];best=Math.max(best,Math.floor(score));localStorage.highwayBest=best;B.textContent=best;panel.style.display='flex';panel.innerHTML='<h1>RACE OVER</h1><p>Score <b>'+Math.floor(score)+'</b><br>Best '+best+'</p><button class="play" id="again">RACE AGAIN</button>';document.getElementById('again').onclick=start}function loop(t){if(!run)return;if(!last)last=t;let dt=Math.min(30,t-last);last=t,level=1+Math.min(3,score/150);score+=dt*.01*level;S.textContent=Math.floor(score);V.textContent=level.toFixed(1)+'x';if(t-spawnAt>Math.max(390,900-level*120)){spawn();spawnAt=t}let cy=w.clientHeight-105;for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=dt*.19*level;o.e.style.top=o.y+'px';let scale=.58+Math.min(1,o.y/w.clientHeight)*.45;o.e.style.transform='translateX(-50%) scale('+scale+')';if(+o.e.dataset.lane===lane&&o.y>cy-58&&o.y<cy+28){if(o.coin){score+=5;o.e.remove();items.splice(i,1)}else return end()}else if(o.y>w.clientHeight+80){o.e.remove();items.splice(i,1)}}raf=requestAnimationFrame(loop)}function start(){items.forEach(o=>o.e.remove());items=[];lane=1;score=0;last=0;spawnAt=0;run=true;panel.style.display='none';pos();raf=requestAnimationFrame(loop)}document.getElementById('play').onclick=start;document.getElementById('left').onclick=()=>steer(-1);document.getElementById('right').onclick=()=>steer(1);w.onpointerdown=e=>sx=e.clientX;w.onpointerup=e=>{if(sx!==null&&Math.abs(e.clientX-sx)>25)steer(e.clientX>sx?1:-1);sx=null};document.onkeydown=e=>{if(e.key==='ArrowLeft')steer(-1);if(e.key==='ArrowRight')steer(1)};
</script></body></html>
