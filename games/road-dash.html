<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Dash | SR GAMERS</title><style>
*{box-sizing:border-box}body{margin:0;background:#060912;color:#fff;font-family:Arial,sans-serif;text-align:center}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ffffff18}.brand{font-weight:900;letter-spacing:2px;color:#edc565}.home{color:#c8ced9;text-decoration:none}.wrap{max-width:480px;margin:auto;padding:14px}.tag{font-size:11px;letter-spacing:3px;color:#edc565}.title{font-size:30px;font-weight:900;margin:5px}.hud{display:flex;justify-content:space-between;background:#101725;border:1px solid #ffffff15;border-radius:16px;padding:10px 18px;margin:12px 0}.hud b{display:block;color:#edc565;font-size:20px}.road{height:560px;max-height:68vh;min-height:430px;position:relative;overflow:hidden;border-radius:24px;border:1px solid #edc56555;background:linear-gradient(90deg,#12351d 0 14%,#242932 14% 86%,#12351d 86%);touch-action:none;box-shadow:0 20px 55px #0009}.road:before{content:"";position:absolute;inset:0 15%;border-left:5px solid #e9e9e9;border-right:5px solid #e9e9e9;background:repeating-linear-gradient(180deg,transparent 0 44px,#ffffffd0 45px 76px,transparent 77px 126px);background-size:4px 126px;background-position:center;animation:road .55s linear infinite}.road:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 72px,#ffffff18 73px 75px,transparent 76px 145px);pointer-events:none}@keyframes road{to{background-position:center 126px}}.car,.enemy,.coin{position:absolute;z-index:2;transform:translateX(-50%);user-select:none}.car{bottom:24px;width:40px;height:70px;border-radius:12px 12px 9px 9px;background:linear-gradient(90deg,#8d1018,#ed3f48 25% 75%,#8d1018);border:2px solid #ff7c82;box-shadow:0 8px 18px #000b;transition:left .12s}.car:before{content:"";position:absolute;left:7px;right:7px;top:10px;height:22px;border-radius:7px;background:linear-gradient(#9bd5ef,#23465e);border:2px solid #171d26}.car:after{content:"";position:absolute;left:5px;right:5px;bottom:8px;height:8px;border-radius:5px;background:#ffcc55;box-shadow:-7px 1px 0 -2px #111,7px 1px 0 -2px #111}.enemy{top:-80px;width:38px;height:66px;border-radius:11px;background:linear-gradient(90deg,#173c72,#3b8de0 25% 75%,#173c72);border:2px solid #7ec3ff;box-shadow:0 7px 15px #0009}.enemy:before{content:"";position:absolute;left:7px;right:7px;top:10px;height:20px;border-radius:6px;background:#9ed8ef;border:2px solid #172331}.coin{top:-45px;font-size:30px;filter:drop-shadow(0 0 8px #ffd85a)}.panel{position:absolute;inset:0;z-index:5;background:#070b12eF;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px}.panel h1{color:#edc565;font-size:36px;margin:0 0 8px}.panel p{color:#b9c1ce;line-height:1.5}.play{border:0;border-radius:999px;background:#edc565;color:#101010;font-weight:900;font-size:17px;padding:14px 30px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.controls button{min-height:54px;border:1px solid #ffffff22;border-radius:16px;background:#111927;color:#fff;font-size:24px;font-weight:900}.hint{font-size:12px;color:#929cab;margin:10px}</style></head><body>
<div class="top"><div class="brand">SR GAMERS</div><a class="home" href="/#games">← Home</a></div><main class="wrap"><div class="tag">VEENA STUDIOS • ARCADE</div><div class="title">🏁 ROAD DASH</div><div class="hud"><span>Score<b id="score">0</b></span><span>Speed<b id="speed">1x</b></span><span>Best<b id="best">0</b></span></div><div class="road" id="road"><div class="panel" id="panel"><h1>ROAD DASH</h1><p>Change lanes. Dodge traffic. Collect coins.<br>The road gets faster as your score climbs.</p><button class="play" id="play">START RACE</button></div><div class="car" id="car" aria-label="Player car"></div></div><div class="controls"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div><div class="hint">Use buttons or swipe left/right • +5 for coins</div></main>
<script>
const road=document.getElementById('road'),car=document.getElementById('car'),panel=document.getElementById('panel'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),bestEl=document.getElementById('best');const lanes=[28,50,72];let lane=1,score=0,running=false,items=[],last=0,lastSpawn=0,raf=0,startX=null;let best=+(localStorage.roadDashBest||0);bestEl.textContent=best;
function placeCar(){car.style.left=lanes[lane]+'%'}placeCar();
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));placeCar()}
function spawn(){const e=document.createElement('div'),coin=Math.random()<.22;e.className=coin?'coin':'enemy';e.textContent=coin?'●':'';if(coin){e.style.color='#ffd34f';e.style.fontSize='34px';e.style.textShadow='0 0 10px #ffd34f' }else{const hues=['#3b8de0','#e5b73b','#45a86d','#8e62d8'];const h=hues[Math.floor(Math.random()*hues.length)];e.style.background='linear-gradient(90deg,#152238,'+h+' 25% 75%,#152238)';}e.dataset.lane=Math.floor(Math.random()*3);e.style.left=lanes[e.dataset.lane]+'%';road.appendChild(e);items.push({el:e,y:-70,coin})}
function end(){running=false;cancelAnimationFrame(raf);items.forEach(x=>x.el.remove());items=[];best=Math.max(best,Math.floor(score));localStorage.roadDashBest=best;bestEl.textContent=best;panel.style.display='flex';panel.innerHTML='<h1>CRASH!</h1><p>Score: <b>'+Math.floor(score)+'</b><br>Best: '+best+'</p><button class="play" id="again">RACE AGAIN</button>';document.getElementById('again').addEventListener('click',start)}
function loop(ts){if(!running)return;if(!last)last=ts;const dt=Math.min(32,ts-last);last=ts;const level=1+Math.min(2.5,score/180);score+=dt*.008*level;scoreEl.textContent=Math.floor(score);speedEl.textContent=level.toFixed(1)+'x';if(ts-lastSpawn>Math.max(430,900-level*130)){spawn();lastSpawn=ts}const carY=road.clientHeight-100;for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=dt*.18*level;o.el.style.top=o.y+'px';if(+o.el.dataset.lane===lane&&o.y>carY-55&&o.y<carY+35){if(o.coin){score+=5;o.el.remove();items.splice(i,1);continue}else{return end()}}if(o.y>road.clientHeight+60){o.el.remove();items.splice(i,1)}}raf=requestAnimationFrame(loop)}
function start(){items.forEach(x=>x.el.remove());items=[];lane=1;score=0;last=0;lastSpawn=0;running=true;scoreEl.textContent=0;panel.style.display='none';placeCar();raf=requestAnimationFrame(loop)}
document.getElementById('play').addEventListener('click',start);document.getElementById('left').addEventListener('click',()=>move(-1));document.getElementById('right').addEventListener('click',()=>move(1));road.addEventListener('pointerdown',e=>startX=e.clientX);road.addEventListener('pointerup',e=>{if(startX==null)return;const d=e.clientX-startX;if(Math.abs(d)>28)move(d>0?1:-1);startX=null});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
</script></body></html>
