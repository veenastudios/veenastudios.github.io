<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Traffic Escape | SR GAMERS</title><style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#fff;font-family:system-ui,Arial;overflow-x:hidden}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#080b11}.brand{color:#f0c75e;font-weight:900;letter-spacing:2px}.top a{color:#aaa;text-decoration:none}.wrap{width:min(100%,560px);margin:auto;padding:6px 8px 10px}.name{text-align:center;font-size:26px;font-weight:1000}.sub{text-align:center;color:#f0c75e;font-size:9px;letter-spacing:3px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:5px 0}.hud div{background:#0d131d;border:1px solid #ffffff15;border-radius:10px;text-align:center;padding:5px;font-size:8px;color:#8e99a9}.hud b{display:block;color:white;font-size:16px}.game{height:calc(100vh - 178px);min-height:560px;max-height:820px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#558fc2 0 17%,#61794b 17% 23%,#292d33 23%);touch-action:none;box-shadow:0 20px 55px #000}.city{position:absolute;top:8%;left:0;right:0;height:16%;opacity:.8;background:linear-gradient(90deg,#34495a 0 8%,transparent 8% 12%,#405a70 12% 23%,transparent 23% 27%,#2e4659 27% 38%,transparent 38% 44%,#41596b 44% 58%,transparent 58% 64%,#324c61 64% 77%,transparent 77% 82%,#3b5264 82% 95%,transparent 95%)}.road{position:absolute;z-index:1;top:20%;bottom:-8%;left:6%;right:6%;background:#282c32;clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}.road:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.6%,#ffffffb8 49.7% 50.3%,transparent 50.4%);opacity:.6}.edge{position:absolute;z-index:2;top:21%;bottom:-5%;width:7px;background:repeating-linear-gradient(#eee 0 16px,#d33 17px 32px)}.el{left:19%;transform:rotate(9deg);transform-origin:top}.er{right:19%;transform:rotate(-9deg);transform-origin:top}.player,.traffic{position:absolute;z-index:5;width:45px;height:76px;border-radius:12px 12px 8px 8px;transform:translate(-50%,-50%);box-shadow:0 8px 16px #000b}.player{left:50%;top:82%;background:linear-gradient(90deg,#5c0710,#e32835 22% 78%,#5c0710);border:2px solid #ff6972}.player:before,.traffic:before{content:"";position:absolute;left:8px;right:8px;top:10px;height:25px;border-radius:7px;background:linear-gradient(#b9e9ff,#24485e);border:2px solid #111}.player:after,.traffic:after{content:"";position:absolute;left:-5px;right:-5px;bottom:12px;height:18px;border-left:6px solid #050608;border-right:6px solid #050608}.coin{position:absolute;z-index:5;width:27px;height:27px;border-radius:50%;background:#ffd23d;border:3px solid #fff0a0;box-shadow:0 0 14px #ffd23d;transform:translate(-50%,-50%)}.overlay{position:absolute;z-index:20;inset:0;background:#050810e8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.overlay h1{margin:0;color:#f0c75e;font-size:34px}.overlay p{color:#b8c1ce;line-height:1.5}.play{border:0;border-radius:999px;background:#f0c75e;color:#161006;font-weight:1000;font-size:16px;padding:14px 28px}.toast{position:absolute;z-index:15;top:30%;left:50%;transform:translateX(-50%);font-weight:1000;color:#ffd75c;font-size:20px;opacity:0}.controls{display:flex;gap:8px;margin-top:6px}.controls button{flex:1;height:48px;border:1px solid #ffffff17;border-radius:13px;background:#111823;color:#fff;font-weight:800}.hint{text-align:center;font-size:10px;color:#798494;margin:6px}@media(max-width:600px){.top{height:42px;padding:0 10px}.brand{font-size:11px}.wrap{width:100%;padding:3px 5px 7px}.sub{font-size:7px;margin-top:1px}.name{font-size:21px;line-height:1.05}.hud{gap:3px;margin:4px 0}.hud div{padding:3px 2px;font-size:7px}.hud b{font-size:14px}.game{height:calc(100vh - 150px);min-height:610px;max-height:none;border-radius:14px}.controls{margin-top:4px}.controls button{height:50px}.hint{font-size:8px;margin:3px}.player{width:52px;height:88px}.traffic{width:50px;height:84px}}@media(max-width:380px){.game{min-height:570px}.name{font-size:19px}}</style></head><body>
<div class="top"><span class="brand">SR GAMERS</span><a href="/#games">← Home</a></div><div class="wrap"><div class="sub">VEENA STUDIOS • ARCADE</div><div class="name">TRAFFIC ESCAPE</div><div class="hud"><div>SCORE<b id="score">0</b></div><div>COINS<b id="coins">0</b></div><div>SPEED<b id="speed">1.0x</b></div><div>BEST<b id="best">0</b></div></div><div class="game" id="g"><div class="city"></div><div class="road"></div><div class="edge el"></div><div class="edge er"></div><div class="toast" id="toast">NEAR MISS +3</div><div class="player" id="p"></div><div class="overlay" id="ov"><h1>TRAFFIC ESCAPE</h1><p>Cut through traffic. Collect coins.<br><b>Risk a near miss for bonus points.</b><br><small>Drag anywhere to steer.</small></p><button class="play" id="start">START DRIVE</button></div></div><div class="controls"><button id="brake">BRAKE</button><button id="boost">BOOST</button></div><div class="hint">Drag left/right • Brake in traffic • Boost on an open road</div></div><script>
const g=document.getElementById('g'),p=document.getElementById('p'),ov=document.getElementById('ov'),S=document.getElementById('score'),C=document.getElementById('coins'),V=document.getElementById('speed'),B=document.getElementById('best'),T=document.getElementById('toast');let x=.5,target=.5,score=0,coins=0,best=+(localStorage.teBest||0),run=0,last=0,next=0,items=[],brake=0,boost=0,raf;B.textContent=best;function px(){return g.clientWidth*x}function spawn(){let coin=Math.random()<.18,e=document.createElement('div');e.className=coin?'coin':'traffic';let xx=.29+Math.random()*.42;e.style.left=xx*100+'%';if(!coin){let c=['#2876c8','#e3a32e','#45a56a','#815fd0','#ddd'][Math.floor(Math.random()*5)];e.style.background=c}g.appendChild(e);items.push({e,x:xx,y:.19,coin,near:0})}function toast(){T.style.opacity=1;setTimeout(()=>T.style.opacity=0,450)}function end(){run=0;cancelAnimationFrame(raf);best=Math.max(best,Math.floor(score));localStorage.teBest=best;B.textContent=best;items.forEach(o=>o.e.remove());items=[];ov.style.display='flex';ov.innerHTML='<h1>CRASH!</h1><p>Score <b>'+Math.floor(score)+'</b> • Coins <b>'+coins+'</b><br>Best '+best+'</p><button class="play" id="again">DRIVE AGAIN</button>';document.getElementById('again').onclick=start}function loop(t){if(!run)return;if(!last)last=t;let dt=Math.min(30,t-last);last=t;x+=(target-x)*Math.min(1,dt*.018);p.style.left=x*100+'%';let base=1+Math.min(2.4,score/220),mult=brake?.62:boost?1.38:1,sp=base*mult;score+=dt*.008*sp;S.textContent=Math.floor(score);V.textContent=sp.toFixed(1)+'x';C.textContent=coins;if(t-next>Math.max(430,920-base*130)){spawn();next=t}let py=.82;for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=dt*.00034*sp;let perspective=.45+o.y*.8;o.e.style.top=o.y*100+'%';o.e.style.transform='translate(-50%,-50%) scale('+perspective+')';let dx=Math.abs(o.x-x),dy=Math.abs(o.y-py);if(dy<.065&&dx<.075){if(o.coin){coins++;score+=5;o.e.remove();items.splice(i,1)}else return end()}else if(!o.coin&&!o.near&&o.y>py+.06&&dx<.13){o.near=1;score+=3;toast()}else if(o.y>1.12){o.e.remove();items.splice(i,1)}}raf=requestAnimationFrame(loop)}function start(){items.forEach(o=>o.e.remove());items=[];x=target=.5;score=coins=0;last=next=0;run=1;ov.style.display='none';raf=requestAnimationFrame(loop)}function steer(clientX){let r=g.getBoundingClientRect();target=Math.max(.25,Math.min(.75,(clientX-r.left)/r.width))}g.onpointerdown=e=>{if(run){g.setPointerCapture(e.pointerId);steer(e.clientX)}};g.onpointermove=e=>{if(run&&e.buttons)steer(e.clientX)};document.getElementById('start').onclick=start;for(const [id,key] of [['brake','brake'],['boost','boost']]){let b=document.getElementById(id);b.onpointerdown=()=>window[key]=1;b.onpointerup=b.onpointerleave=()=>window[key]=0}document.getElementById('brake').onpointerdown=()=>brake=1;document.getElementById('brake').onpointerup=()=>brake=0;document.getElementById('boost').onpointerdown=()=>boost=1;document.getElementById('boost').onpointerup=()=>boost=0;
</script></body></html>
