name: Tap Rush Android Preview
on:
  push:
    branches: [audit/tap-rush-playstore-safe-20261025]
    paths:
      - 'android/tap-rush/**'
      - '.github/workflows/tap-rush-android-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stage offline web assets
        run: python3 android/tap-rush/prepare_assets.py
      - name: Build unsigned-for-release debug APK
        working-directory: android/tap-rush
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tap-rush-debug-preview
          path: android/tap-rush/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
