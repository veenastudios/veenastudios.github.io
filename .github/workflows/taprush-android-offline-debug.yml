name: Tap Rush offline Android debug
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-taprush/**'
      - 'tap-rush/**'
      - '.github/workflows/taprush-android-offline-debug.yml'
  push:
    branches: [taprush-android-offline-v6]
    paths:
      - 'tap-rush/**'
      - 'android-taprush/**'
      - '.github/workflows/taprush-android-offline-debug.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-taprush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled command-line tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate offline packer syntax
        run: python3 -m py_compile prepare_offline.py verify_offline.py
      - name: Bundle offline game
        run: python3 prepare_offline.py ../tap-rush
      - name: Verify complete offline assets
        run: python3 verify_offline.py
      - name: Verify entrypoint
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/assets/index-B_be548G.js
          test -s app/src/main/assets/assets/index-DJsOUZk8.css
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Validate premium UI and world-map fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          for token in ('srCoinValue', 'srHomePlay', 'worldTrail::before', 'approved-world-selection.webp', 'approved-home-carousel.png'):
              assert token in html, f'Missing UI requirement: {token}'
          for image in ('approved-world-selection.webp', 'approved-home-carousel.png'):
              assert Path('app/src/main/assets', image).stat().st_size > 10000, image
          print('Premium home, live coins, world map and artwork verified')
          PY
      - name: Build unsigned release AAB for signing preparation
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - name: Record build environment
        if: always()
        run: |
          java -version
          gradle --version
          echo "Android SDK: $ANDROID_HOME"
          find app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: taprush-offline-debug-apk
          path: android-taprush/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: taprush-unsigned-release-aab-NOT-FOR-UPLOAD
          path: android-taprush/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
