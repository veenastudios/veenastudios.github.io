name: Tap Rush offline Android debug
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-taprush/**'
      - 'tap-rush/**'
      - '.github/workflows/taprush-android-offline-debug.yml'
  push:
    branches: [taprush-android-offline-v6]
    paths:
      - 'tap-rush/**'
      - 'android-taprush/**'
      - '.github/workflows/taprush-android-offline-debug.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-taprush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled command-line tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate offline packer syntax
        run: python3 -m py_compile prepare_offline.py verify_offline.py
      - name: Bundle offline game
        run: python3 prepare_offline.py ../tap-rush
      - name: Verify complete offline assets
        run: python3 verify_offline.py
      - name: Verify coin unlock integration and lock notice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text()
          js=Path('app/src/main/assets/assets/index-B_be548G.js').read_text()
          for token in ('syncWorldLocks', 'data-lock-price', 'srWorldLockTimer', '},800)', 'srWorldLockNotice'):
              assert token in html, f'Missing lock UI: {token}'
          for token in ('srWorldUnlocked_', 'city:150', 'space:200', 'underwater:250', 'himalaya:350'):
              assert token in js, f'Missing world unlock logic: {token}'
          print('World lock UI and coin prices verified in generated assets')
          PY
      - name: Verify rewarded ad test integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('app/src/main/assets/assets/index-B_be548G.js').read_text()
          native=Path('app/src/main/java/in/veenastudios/taprush/MainActivity.java').read_text()
          assert 'srRewardAd' in js and 'srReward20' in js
          assert 'showRewarded' in native and 'ca-app-pub-3940256099942544/5224354917' in native
          assert 'rewardItem->sendEvent("srReward20")' in native
          print('Rewarded ad test bridge and 20-coin callback present')
          PY
      - name: Verify entrypoint
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/assets/index-B_be548G.js
          test -s app/src/main/assets/assets/index-DJsOUZk8.css
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Validate premium UI and world-map fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          for token in ('srCoinValue', 'srHomePlay', 'worldTrail::before', 'approved-world-selection.webp', 'approved-home-carousel.png'):
              assert token in html, f'Missing UI requirement: {token}'
          for image in ('approved-world-selection.webp', 'approved-home-carousel.png'):
              assert Path('app/src/main/assets', image).stat().st_size > 10000, image
          print('Premium home, live coins, world map and artwork verified')
          PY
      - name: Prepare release signing when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.TAPRUSH_KEYSTORE_BASE64 }}
          TAPRUSH_KEYSTORE_PASSWORD: ${{ secrets.TAPRUSH_KEYSTORE_PASSWORD }}
          TAPRUSH_KEY_ALIAS: ${{ secrets.TAPRUSH_KEY_ALIAS }}
          TAPRUSH_KEY_PASSWORD: ${{ secrets.TAPRUSH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$TAPRUSH_KEYSTORE_PASSWORD" ] && [ -n "$TAPRUSH_KEY_ALIAS" ] && [ -n "$TAPRUSH_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/taprush-release.jks"
            echo "TAPRUSH_KEYSTORE_FILE=$RUNNER_TEMP/taprush-release.jks" >> "$GITHUB_ENV"
            echo "TAPRUSH_SIGNED=true" >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_BASE64$TAPRUSH_KEYSTORE_PASSWORD$TAPRUSH_KEY_ALIAS$TAPRUSH_KEY_PASSWORD" ]; then
            echo "::error::Incomplete Tap Rush signing secrets. Configure all four secrets."
            exit 1
          else
            echo "TAPRUSH_SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Build release AAB (signed only when secrets configured)
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/taprush-release.jks"
      - name: Record build environment
        if: always()
        run: |
          java -version
          gradle --version
          echo "Android SDK: $ANDROID_HOME"
          find app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: taprush-offline-debug-apk
          path: android-taprush/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: taprush-release-aab-SIGNATURE-REQUIRES-VERIFICATION
          path: android-taprush/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
