name: Tap Rush Android build (API 36)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-taprush/**'
      - 'tap-rush/**'
      - '.github/workflows/tap-rush-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check offline packager syntax and monetization safety
        run: |
          python3 -m py_compile android-taprush/prepare_offline.py
          python3 - <<'PY'
          from pathlib import Path
          app = Path("android-taprush/app/src/main/java/in/veenastudios/taprush/MainActivity.java").read_text()
          gradle = Path("android-taprush/app/build.gradle").read_text()
          packager = Path("android-taprush/prepare_offline.py").read_text()
          assert "if (BuildConfig.DEBUG)" in app, "Production rewarded ads must remain gated until consent"
          assert "WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG)" in app, "Release WebView debugging must be disabled"
          assert "setAllowUniversalAccessFromFileURLs(false)" in app, "File URL universal access must be disabled"
          assert "Offline resource blocked" in app, "External resources must not load inside offline WebView"
          assert "web!=null&&web.canGoBack()" in app, "Back navigation must be null-safe"
          assert "rewardGranted.compareAndSet(false,true)" in app, "Reward callback must be one-time"
          assert "targetSdk 36" in gradle
          assert 'srWorldUnlocked_' in packager
          assert 'srReward20' in packager
          print("PASS: packager syntax, SDK 36 and monetization safety gates")
          PY
      - name: Verify source-root paths are audited
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("android-taprush/prepare_offline.py").read_text()
          assert 'unsupported site-root asset' in s
          assert 'game entrypoint missing' in s
          assert 'game hub missing' in s
          print("PASS: source-root assets and packaging preconditions are checked")
          PY
      - name: Package and validate offline game
        run: python3 android-taprush/prepare_offline.py tap-rush
      - name: Verify packaged game assets
        run: |
          test -s android-taprush/app/src/main/assets/index.html
          test -s android-taprush/app/src/main/assets/game-hub.html
          test -d android-taprush/app/src/main/assets/assets
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class AssetRefs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  self.refs.extend(value for key, value in attrs if key in ("src", "href") and value)
          root = Path("android-taprush/app/src/main/assets")
          html = (root / "index.html").read_text(encoding="utf-8")
          parser = AssetRefs()
          parser.feed(html)
          refs = parser.refs
          assert any("assets/index-" in r and r.split("?", 1)[0].endswith(".js") for r in refs), "Game JavaScript entry missing"
          for ref in refs:
              if ref.startswith(("http:", "https:", "//", "data:", "#")):
                  continue
              local = ref.split("?", 1)[0].split("#", 1)[0].removeprefix("/tap-rush/").removeprefix("./")
              assert local and not local.startswith("/") and ".." not in Path(local).parts, f"Unsafe asset reference: {ref}"
              assert (root / local).is_file(), f"Missing bundled asset: {ref}"
          assert (root / "game-hub.html").stat().st_size > 0
          print("PASS: offline entrypoint and referenced assets")
          PY
      - name: Debug APK first - compile Android app
        working-directory: android-taprush
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taprush-debug-apk-first
          path: android-taprush/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Configure optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.TAPRUSH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TAPRUSH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAPRUSH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAPRUSH_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/taprush-release.jks"
            echo "TAPRUSH_KEYSTORE_FILE=$RUNNER_TEMP/taprush-release.jks" >> "$GITHUB_ENV"
            echo "TAPRUSH_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TAPRUSH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TAPRUSH_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets missing; release AAB is NOT ready for Play upload."
          fi
      - name: Build APK and AAB
        working-directory: android-taprush
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease 2>&1 | tee "$RUNNER_TEMP/taprush-gradle-build.log"
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taprush-gradle-failure-log
          path: ${{ runner.temp }}/taprush-gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify APK and AAB
        run: |
          test -s android-taprush/app/build/outputs/apk/debug/app-debug.apk
          test -s android-taprush/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android-taprush/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-taprush/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/taprush-badging.txt"
          grep -q "targetSdkVersion:\x2736\x27" "$RUNNER_TEMP/taprush-badging.txt"
          if [[ -n "${TAPRUSH_KEYSTORE_FILE:-}" ]]; then
            jarsigner -verify android-taprush/app/build/outputs/bundle/release/app-release.aab
          else
            echo "::warning::Unsigned release AAB: do not upload."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: taprush-offline-debug-apk
          path: android-taprush/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ env.TAPRUSH_KEYSTORE_FILE != '' }}
        with:
          name: taprush-offline-signed-release-aab
          path: android-taprush/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
