name: G1 APK Read-only Inventory
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify and inspect existing APK
        run: python3 g1-recovery/inspect_apk.py g1-recovery-output
      - name: Upload inspection report (not APK)
        uses: actions/upload-artifact@v4
        with:
          name: g1-apk-inventory
          path: g1-recovery-output/apk-inventory.json
          retention-days: 14
